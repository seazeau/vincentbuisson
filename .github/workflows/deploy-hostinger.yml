name: Déploiement Hostinger Automatique

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permet de lancer le déploiement manuellement depuis GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Installation des dépendances
        run: npm install

      - name: 🔨 Compilation statique Next.js (Export out/)
        run: npm run build

      - name: 🚀 Déploiement vers Hostinger via basic-ftp
        run: node scripts/deploy-hostinger.js --skip-build --verbose
        env:
          HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          HOSTINGER_FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_REMOTE_DIR: ${{ secrets.HOSTINGER_REMOTE_DIR || 'public_html' }}
          HOSTINGER_FTP_SECURE: "false"
